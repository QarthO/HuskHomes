# Carry out tests on pull requests
name: PR Tests

on:
  pull_request:
    branches: [ 'master' ]

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout for CI 🛎'
        uses: actions/checkout@v6
      - name: 'Set up JDK 21 📦'
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: 'Build with Gradle 🏗️'
        uses: gradle/gradle-build-action@v3
        with:
          arguments: test
      - name: 'Publish Test Report 📊'
        uses: mikepenz/action-junit-report@v6
        if: success() || failure() # Continue on failure
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'

  build-jars:
    name: Build trusted PR jars
    # A branch in this repository can only be pushed by a contributor with access.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout for CI 🛎'
        uses: actions/checkout@v7
      - name: 'Set up JDK 25 📦'
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: 'Set up Gradle 🏗️'
        uses: gradle/actions/setup-gradle@v6
      - name: 'Build jars with Gradle 🏗️'
        run: ./gradlew assemble --no-daemon
      - name: 'Upload Paper jar 📤'
        uses: actions/upload-artifact@v7
        with:
          name: huskhomes-paper
          path: target/HuskHomes-Paper-*.jar
          if-no-files-found: error
          compression-level: 0
      - name: 'Upload Fabric 1.21.1 jar 📤'
        uses: actions/upload-artifact@v7
        with:
          name: huskhomes-fabric-1.21.1
          path: target/HuskHomes-Fabric-*+mc.1.21.1.jar
          if-no-files-found: error
          compression-level: 0
      - name: 'Upload Fabric 1.21.11 jar 📤'
        uses: actions/upload-artifact@v7
        with:
          name: huskhomes-fabric-1.21.11
          path: target/HuskHomes-Fabric-*+mc.1.21.11.jar
          if-no-files-found: error
          compression-level: 0
      - name: 'Upload Fabric 26.1.2 jar 📤'
        uses: actions/upload-artifact@v7
        with:
          name: huskhomes-fabric-26.1.2
          path: target/HuskHomes-Fabric-*+mc.26.1.2.jar
          if-no-files-found: error
          compression-level: 0
      - name: 'Upload Fabric 26.2 jar 📤'
        uses: actions/upload-artifact@v7
        with:
          name: huskhomes-fabric-26.2
          path: target/HuskHomes-Fabric-*+mc.26.2.jar
          if-no-files-found: error
          compression-level: 0
